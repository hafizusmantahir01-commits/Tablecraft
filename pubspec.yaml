name: tablecraft
description: Tablecraft - a relaxing jigsaw puzzle game.
publish_to: 'none'
version: 1.0.0+1 # 1.0.0 = version name users see, 1 = build number (raise it for every Play upload)

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.2
  url_launcher: ^6.2.5
  audioplayers: ^6.8.1
  vibration: ^3.2.1
  image_picker: ^1.0.7
  path_provider: ^2.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0

# Splash shown by Android/iOS/web while Flutter starts (before our animated SplashScreen).
# Run:  dart run flutter_native_splash:create
flutter_native_splash:
  color: "#E7C99C"
  image: assets/icon/splash_logo.png
  android_12:
    color: "#E7C99C"
    image: assets/icon/splash_logo.png
  web: true

# App icon: run  dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: assets/icon/icon.png
  adaptive_icon_background: "#E7C99C"
  adaptive_icon_foreground: assets/icon/icon_foreground.png
  web:
    generate: true
    image_path: assets/icon/icon.png
    background_color: "#E7C99C"
    theme_color: "#1E6E68"

flutter:
  uses-material-design: true
  assets:
    - assets/puzzles/
    - assets/sounds/
    - assets/fonts/OFL.txt

  # Nunito is bundled inside the app: works offline, no requests to font servers.
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
          weight: 400
        - asset: assets/fonts/Nunito-Medium.ttf
          weight: 500
        - asset: assets/fonts/Nunito-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
        - asset: assets/fonts/Nunito-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Nunito-Black.ttf
          weight: 900
